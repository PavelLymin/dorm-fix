name: ui_kit
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: '>=3.12.0-221.0.dev <4.0.0'

dependencies:
  animations: ^2.1.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SF Pro
      fonts:
        - asset: lib/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: lib/fonts/SF-Pro-Display-Semibold.otf
          weight: 600

    - family: UiIcons
      fonts:
        - asset: lib/fonts/Icons.ttf


